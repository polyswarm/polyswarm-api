[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polyswarm_api"
version = "4.2.0"
description = "Client library to simplify interacting with the PolySwarm consumer API"
readme = "README.md"
requires-python = ">=3.10,<4"
authors = [{ name = "PolySwarm Developers", email = "info@polyswarm.io" }]
license = { text = "MIT" }
urls = { Homepage = "https://github.com/polyswarm/polyswarm-api" }
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "httpx>=0.27",
  "python-dateutil>=2.9",
  "jmespath>=1.0",
]

[project.optional-dependencies]
# Retained for backward compatibility; ``httpx`` is now a core dependency
# so the ``[async]`` extra is a no-op. Downstream consumers can keep
# pinning ``polyswarm-api[async]`` without change.
async = []
tests = [
    "bump-my-version~=1.2",
    "pytest~=7.4",
    "jsonschema~=3.0.2",
    "python-dateutil~=2.9.0",
    'vcrpy~=7.0',
    "pytest-asyncio>=0.23",
    "pytest-timeout~=2.3",
    "pytest-xdist~=3.6",
    "respx>=0.21",
    "httpx>=0.27",
]
dev = [
    "unasync>=0.6",
    "ruff>=0.6",
]

[tool.setuptools]
include-package-data = true
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.bumpversion]
current_version = "4.2.0"
commit = true
tag = false
sign_tags = true
tag_name = "{new_version}"
parse = '^(?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)(?:\.dev(?P<dev>\d+))?(?:\+(?P<local>[a-z0-9]+(?:\.[a-z0-9]+)*))?$'
serialize = [
  "{major}.{minor}.{patch}.dev{dev}+{short_commit_sha}",
  "{major}.{minor}.{patch}"
]

[tool.bumpversion.parts.dev]
first_value = "0"
optional_value = "0"

[[tool.bumpversion.files]]
filename = "src/polyswarm_api/__init__.py"
search = "__version__ = '{current_version}'"
replace = "__version__ = '{new_version}'"

[tool.pytest.ini_options]
log_cli = true
# Default live-log level. INFO keeps the useful app request/response lines while
# dropping the DEBUG firehose (VCR per-request match trace, parse traces) that
# otherwise bloats CI logs ~1000x. Override per-run with the TESTS_LOG_LEVEL env
# var (e.g. TESTS_LOG_LEVEL=DEBUG to log everything); see test/conftest.py.
log_cli_level = "INFO"
log_format = "%(asctime)s %(levelname)-2s [%(name)s:%(filename)s:%(lineno)d:%(funcName)1s()] %(message)s"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["test"]
norecursedirs = [
    ".git",
    ".idea",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
asyncio_mode = "auto"
addopts = [
    "--continue-on-collection-errors",
    "-s",
    "-ra",
]
