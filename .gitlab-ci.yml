include:
  - project: '$CI_TEMPLATE'
    ref: master
    file: '.gitlab-ci-default.yaml'

variables:
  BASE_IMAGE_NAME: polyswarm-api

###############################################################
# Build Stage
###############################################################

dev-pypi:
  extends: .dev-pypi

# Build the polyswarm-api test image (whole repo + suite) from docker/Dockerfile.
# .build-docker tags it :$CI_COMMIT_SHA and :$CI_COMMIT_REF_SLUG, so the e2e stack
# (running on the same-named branch) resolves the matching image for its
# `polyswarm-api` command, which runs this suite VCR-off against the live stack.
# Not built on master: the test image tracks develop (see `release`); master is
# the PyPI release only, so no :master image exists for any e2e cascade to pick.
build:
  extends: .build-docker
  except:
    - master

###############################################################
# Test Stage
###############################################################

test-run310:
  tags:
    - stage-kube-newer
  image: python:3.10
  stage: test
  before_script:
    - pip install --upgrade pip
  script:
    - pip install .[tests]
    - pytest -s -v

test-run311:
  tags:
    - stage-kube-newer
  image: python:3.11
  stage: test
  before_script:
    - pip install --upgrade pip
  script:
    - pip install .[tests]
    - pytest -s -v

test-run312:
  tags:
    - stage-kube-newer
  image: python:3.12
  stage: test
  before_script:
    - pip install --upgrade pip
  script:
    - pip install .[tests]
    - pytest -s -v

test-unasync-mirror:
  tags:
    - stage-kube-newer
  image: python:3.12
  stage: test
  before_script:
    - pip install --upgrade pip
    - pip install unasync ruff
  script:
    - python scripts/regenerate_sync.py
    - |
      git diff --exit-code -- src/polyswarm_api/ || {
        echo "Sync mirror is stale. Run scripts/regenerate_sync.py and commit the result."
        exit 1
      }

###############################################################
# End-to-end Stage
###############################################################

# Bring up the full platform and run this suite (VCR-off) against it as the e2e
# `polyswarm-api` command. Validates the SDK against the live stack on every MR.
# Skipped on master (no test image is built there — see `build` / `release`).
e2e:
  extends: .e2e
  except:
    - master

###############################################################
# Release Stage
###############################################################

release-pypi:
  extends: .release-pypi-public

# Promote the SHA-tagged image to :latest from DEVELOP (overriding the template's
# master-only default). The polyswarm-api image is a TEST artifact, not a deployed
# service: every other repo's e2e pipeline resolves `polyswarm-api:latest` by
# default (the compose service is tagless), so :latest must track the latest
# integrated SDK on develop — not the released package on master. Master ships the
# PyPI package only (release-pypi); it builds no image.
release:
  extends: .release-docker
  only:
    - develop
