include:
  - project: 'externalci/ci-image'
    ref: master
    file: '.gitlab-ci-default.yaml'

###############################################################
# Build Stage
###############################################################

dev-pypi:
  extends: .dev-pypi

###############################################################
# Test Stage
###############################################################

test-run310:
  tags:
    - stage-kube-newer
  image: python:3.10
  stage: test
  before_script:
    - pip install --upgrade pip
  script:
    - pip install .[tests]
    - pytest -s -v

test-run311:
  tags:
    - stage-kube-newer
  image: python:3.11
  stage: test
  before_script:
    - pip install --upgrade pip
  script:
    - pip install .[tests]
    - pytest -s -v

test-run312:
  tags:
    - stage-kube-newer
  image: python:3.12
  stage: test
  before_script:
    - pip install --upgrade pip
  script:
    - pip install .[tests]
    - pytest -s -v

test-unasync-mirror:
  tags:
    - stage-kube-newer
  image: python:3.12
  stage: test
  before_script:
    - pip install --upgrade pip
    - pip install unasync ruff
  script:
    - python scripts/regenerate_sync.py
    - |
      git diff --exit-code -- src/polyswarm_api/ || {
        echo "Sync mirror is stale. Run scripts/regenerate_sync.py and commit the result."
        exit 1
      }

###############################################################
# Release Stage
###############################################################

release-pypi:
  extends: .release-pypi-public
